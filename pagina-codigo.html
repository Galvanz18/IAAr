<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduza o código</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f3f3f3;
      margin: 0;
      padding: 40px 16px;
      color: #1b1b1b;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 32px 40px 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 12px; }
    .instruction { font-size: 15px; color: #444; margin: 0 0 24px; }

    .code-copy {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 12px 12px 12px 20px;
      background: #f2f2f2; border: 1px solid #d6d6d6; border-radius: 6px;
      box-sizing: border-box; margin-bottom: 24px;
    }
    .code-copy__text {
      font-family: "Courier New", Consolas, monospace; font-size: 22px;
      font-weight: 700; letter-spacing: 4px; color: #222;
    }
    .code-copy__btn {
      font-family: Arial, sans-serif; font-size: 14px; padding: 8px 14px;
      background: #fff; color: #222; border: 1px solid #bdbdbd;
      border-radius: 4px; cursor: pointer;
    }
    .code-copy__btn:hover { background: #f7f7f7; }
    .code-copy__btn.copiado { border-color: #2e7d32; color: #2e7d32; }

    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .user-input {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      font-size: 15px; border: 1px solid #8a8886; border-radius: 2px;
      margin-bottom: 24px;
    }
    .user-input:focus { outline: 2px solid #0078d4; border-color: #0078d4; }

    .actions { text-align: right; }

    .footer {
      margin-top: 32px; padding-top: 16px; border-top: 1px solid #eee;
      font-size: 12px; color: #666; display: flex; gap: 20px;
    }
    .footer a { color: #666; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Introduza o código</h1>
    <p class="instruction">Copie o código de ativação abaixo e introduza-o para verificar o seu dispositivo.</p>

    <div class="code-copy">
      <span class="code-copy__text" id="codigo">CWDB-FHKT</span>
      <button type="button" class="code-copy__btn" data-target="codigo">Copiar</button>
    </div>

    <form method="post" rel="noopener" target="_self">
      <label for="code">Código de ativação</label>
      <input type="text" id="code" name="code" class="user-input" placeholder="CWDB-FHKT" autocomplete="off" spellcheck="false">
      <div class="actions">
        <a role="button" href="#" rel="noopener"
           style="display:inline-block; color:#ffffff; background:#0078d4; border:5px solid #0078d4; border-radius:2px; padding:5px 20px; font-family:'Segoe UI', Arial, sans-serif; font-weight:600; font-size:14px; text-decoration:none;"
           target="_self">Seguinte</a>
      </div>
    </form>

    <div class="footer">
      <a href="#" rel="noopener" target="_self">Termos de utilização</a>
      <a href="#" rel="noopener" target="_self">Privacidade e cookies</a>
    </div>
  </div>

  <script>
    document.querySelectorAll('.code-copy__btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var texto = document.getElementById(btn.dataset.target).textContent.trim();
        function feito() {
          btn.textContent = 'Copiado!';
          btn.classList.add('copiado');
          setTimeout(function () { btn.textContent = 'Copiar'; btn.classList.remove('copiado'); }, 2000);
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(texto).then(feito);
        } else {
          var ta = document.createElement('textarea');
          ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta); feito();
        }
      });
    });
  </script>
</body>
</html>
